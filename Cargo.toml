[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# В отладочной сборке наш код слегка оптимизирован, а библиотеки — полностью:
# иначе симуляция на тысячу солдат в debug будет ползти.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
